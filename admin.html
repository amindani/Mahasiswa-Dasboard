<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin Arsip Akademik</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/icon?family=Material+Icons+Sharp" rel="stylesheet"><link rel="stylesheet" href="style.css"><style>
.admin-wrap{max-width:900px;margin:0 auto;padding:34px 20px}.admin-head{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;margin-bottom:24px}.admin-head h1{font-size:clamp(24px,4vw,34px)}.admin-head p,.hint{color:var(--muted);font-size:12px;line-height:1.7}.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:23px;margin-bottom:20px;box-shadow:var(--shadow)}.panel h2{font-size:18px;margin-bottom:16px}.form{display:grid;gap:14px}.form label{display:grid;gap:7px;font-weight:700;font-size:12px}.form input,.form select,.form textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--text);font:inherit}.form textarea{min-height:75px}.btn{border:0;border-radius:9px;padding:11px 15px;background:var(--primary);color:white;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px}.btn.secondary{background:var(--primary-soft);color:var(--primary)}.btn.danger{background:#b42318}.btn:disabled{opacity:.6}.message{padding:11px 13px;border-radius:9px;margin-top:13px;font-size:12px;overflow-wrap:anywhere}.error{background:#fee4e2;color:#912018}.success{background:#dcfae6;color:#05603a}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.admin-file{border:1px solid var(--line);border-radius:11px;padding:13px;margin-top:10px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.admin-file strong,.admin-file small{display:block;overflow-wrap:anywhere}.admin-file small{color:var(--muted);margin-top:3px}.hidden{display:none!important}.back{color:var(--primary);font-weight:700;font-size:12px}@media(max-width:580px){.admin-wrap{padding:20px 13px}.panel{padding:16px}}
</style></head><body><main class="admin-wrap"><header class="admin-head"><div><h1>Admin Arsip Akademik</h1><p>Upload dan kelola materi atau tugas di Dashboard Mahasiswa.</p></div><a class="back" href="index.html">← Kembali ke website</a></header>
<section class="panel" id="loginPanel"><h2>Login Admin</h2><form class="form" id="loginForm"><label>Email admin<input type="email" id="email" autocomplete="username" required></label><label>Password<input type="password" id="password" autocomplete="current-password" required></label><button class="btn" id="loginButton" type="submit">Login</button></form><div id="loginMessage" aria-live="polite"></div><p class="hint">Buat akun admin secara manual di Supabase Authentication → Users. Jangan aktifkan pendaftaran publik.</p></section>
<section class="panel hidden" id="uploadPanel"><div class="row"><h2>Upload File</h2><button class="btn secondary" id="logoutButton" type="button">Logout</button></div><form class="form" id="uploadForm"><label>Pilih file<input type="file" id="fileInput" accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.txt,.zip" required></label><label>Kategori<select id="category"><option>Materi Kuliah</option><option>Tugas Kuliah</option><option>Lainnya</option></select></label><label>Keterangan (opsional)<textarea id="description" maxlength="500" placeholder="Contoh: Pertemuan 1"></textarea></label><button class="btn" id="uploadButton" type="submit">Upload File</button></form><div id="uploadMessage" aria-live="polite"></div></section>
<section class="panel hidden" id="filesPanel"><h2>File yang Diunggah lewat Admin</h2><div id="adminFiles" class="hint">Memuat...</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="admin.js"></script></body></html>
